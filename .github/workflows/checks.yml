name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install openpyxl
      - name: Trava de sanitização
        env:
          SANITIZE_BLOCKLIST: ${{ secrets.SANITIZE_BLOCKLIST }}
        run: python tools/check_sanitized.py
      - name: Testes dos scripts
        run: python tools/smoke_test.py
